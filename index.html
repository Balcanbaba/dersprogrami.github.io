<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Ders Programı</title>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header class="header">
            <h1>Haftalık Ders Programı</h1>
            <p>Derslerinizi düzenlemek için hücrelere tıklayın ve yazın. Otomatik olarak kaydedilir!</p>
            <div class="actions">
                <button id="clear-btn" class="btn danger-btn">Tümünü Temizle</button>
            </div>
        </header>

        <main class="schedule-wrapper">
            <table class="schedule-table" id="schedule">
                <thead>
                    <tr>
                        <th class="time-col">Ders</th>
                        <th>Pazartesi</th>
                        <th>Salı</th>
                        <th>Çarşamba</th>
                        <th>Perşembe</th>
                        <th>Cuma</th>
                    </tr>
                </thead>
                <tbody id="schedule-body">
                    <!-- JavaScript will generate the 9 rows here -->
                </tbody>
            </table>
        </main>

        <footer>
            <p>Premium Dark Theme - Bilgilers Local Storage'a kaydedilir.</p>
        </footer>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
